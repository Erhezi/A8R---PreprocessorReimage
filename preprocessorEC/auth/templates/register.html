{% extends "base.html" %}
{% block title %}Register — Contract Atlas{% endblock %}
{% block content %}
<div class="container mt-5" style="max-width:400px">
  <h4 class="text-center mb-4">Register</h4>
  <div class="card">
    <div class="card-body">
      <form method="POST" action="{{ url_prefix }}/auth/register">
        <div class="mb-2">
          <label class="form-label">Name</label>
          <input type="text" name="name" class="form-control" placeholder="Full name">
        </div>
        <div class="mb-2">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Role</label>
          <select name="role" class="form-select">
            <option value="sourcing">Sourcing</option>
            <option value="mdm">MDM</option>
            <option value="preprocessor">Preprocessor (Admin)</option>
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>
      </form>
      <p class="text-center mt-3 mb-0">
        Already have an account? <a href="{{ url_prefix }}/auth/login">Log in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
